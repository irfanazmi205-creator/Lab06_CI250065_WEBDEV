<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Collection</title>
</head>
<body>
    <h1>Book Collection Details</h1>

    <script>
        
        const booksData = [
            {
                "title": "The Great Gatsby",
                "author": "F. Scott Fitzgerald",
                "publicationYear": 1925,
                "genres": ["Fiction", "Classics"]
            },
            {
                "title": "To Kill a Mockingbird",
                "author": "Harper Lee",
                "publicationYear": 1960,
                "genres": ["Fiction", "Coming-of-Age"]
            }
        ];

       
        console.log("Title of the first book:", booksData[0].title);

        
        console.log("Author of the second book:", booksData[1].author);

       
        console.log("Genres of all books:");
        booksData.forEach((book, index) => {
            console.log(` Book ${index + 1} (${book.title}):`, book.genres.join(", "));
        });
    </script>
</body>
</html>
